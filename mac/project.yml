name: EB3AMonitor
options:
  bundleIdPrefix: com.legion
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: <TEAM_ID>
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
packages:
  EB3AKit:
    path: EB3AKit
targets:
  EB3AMonitor:
    type: application
    platform: macOS
    sources:
      - EB3AMonitor
      - EB3AWidget/StationWidgetView.swift
    dependencies:
      - package: EB3AKit
      - target: EB3AWidget
        embed: true
    info:
      path: EB3AMonitor/Info.plist
      properties:
        CFBundleDisplayName: EB3A Monitor
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: Підключення до зарядної станції Bluetti EB3A
    entitlements:
      path: EB3AMonitor/EB3AMonitor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.bluetooth: true
        com.apple.security.application-groups: [<TEAM_ID>.eb3a]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legion.eb3amonitor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EB3AWidget:
    type: app-extension
    platform: macOS
    sources: [EB3AWidget]
    dependencies:
      - package: EB3AKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: EB3AWidget/Info.plist
      properties:
        CFBundleDisplayName: EB3A
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EB3AWidget/EB3AWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [<TEAM_ID>.eb3a]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.legion.eb3amonitor.widget
